# Railway(nixpacks) 빌드 설정
# opencv-python(일반판)은 libGL 이 필요하다 — headless 를 못 쓰는 이유는
# simple-lama-inpainting 이 일반판을 의존해 이중설치가 되기 때문(requirements.txt 참조).
[phases.setup]
aptPkgs = ["libgl1", "libglib2.0-0"]
# ⚠ apt 만으로는 부족 — 파이썬 자체가 nix(python310)라서 nix 동적 링커가
#   /usr/lib/x86_64-linux-gnu(apt 설치 경로)를 검색하지 않는다. 그 결과 런타임
#   `import cv2` 가 "libGL.so.1: cannot open shared object file" 로 실패해
#   낙서 지우개가 500 을 냈다(2026-07-11 실사고). nixLibs 는 해당 nix 패키지의
#   lib 경로를 LD_LIBRARY_PATH 에 등록해 이를 해소한다.
#   - glib/libGL: cv2 가 dlopen (libgthread-2.0.so.0, libGL.so.1)
#   - zlib: numpy C 확장이 요구 (libz.so.1) — 없으면 cv2 가 "requires numpy" 로 위장 실패
#   - stdenv.cc.cc.lib: cv2 가 요구 (libstdc++.so.6)
#   4개 조합으로 cv2·numpy·PIL·torch(LaMa) 전부 로드됨을 컨테이너에서 실측(2026-07-11).
nixLibs = ["glib", "libGL", "zlib", "stdenv.cc.cc.lib"]
